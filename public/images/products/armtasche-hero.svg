<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <pattern id="grid-at" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#14161A" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="ticks-at" width="20" height="14" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="14" fill="#14161A" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1000" height="1000" fill="#D7D7E1"/>
  <rect width="1000" height="1000" fill="url(#grid-at)"/>
  <rect width="1000" height="14" fill="url(#ticks-at)"/>

  <text x="48" y="72" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" letter-spacing="2" fill="#6B6E76">FIG. 02 — SPORT-ARMTASCHE</text>

  <!-- curved strap wrapping an arm -->
  <path d="M 320 300 C 150 380, 150 620, 320 700" fill="none" stroke="#14161A" stroke-width="26" stroke-linecap="round" opacity="0.55"/>
  <path d="M 320 320 C 190 390, 190 610, 320 680" fill="none" stroke="#FF4B22" stroke-width="10" stroke-linecap="round"/>

  <!-- phone pouch -->
  <rect x="330" y="330" width="360" height="360" rx="36" fill="#14161A"/>
  <rect x="368" y="372" width="284" height="276" rx="18" fill="#F2F3EF" stroke="#2DD9AA" stroke-width="6"/>
  <circle cx="510" cy="360" r="6" fill="#F2F3EF" opacity="0.7"/>

  <!-- buckle -->
  <rect x="700" y="470" width="70" height="90" rx="12" fill="none" stroke="#14161A" stroke-width="8"/>
  <line x1="700" y1="500" x2="770" y2="500" stroke="#14161A" stroke-width="6"/>
  <line x1="700" y1="530" x2="770" y2="530" stroke="#14161A" stroke-width="6"/>

  <!-- dimension line -->
  <g font-family="IBM Plex Mono, ui-monospace, monospace" fill="#6B6E76">
    <line x1="150" y1="830" x2="850" y2="830" stroke="#14161A" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="150" y1="818" x2="150" y2="842" stroke="#14161A" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="850" y1="818" x2="850" y2="842" stroke="#14161A" stroke-opacity="0.3" stroke-width="2"/>
    <text x="500" y="875" font-size="20" text-anchor="middle" letter-spacing="1">BIZEPSUMFANG 25–40 CM — VERSTELLBAR</text>
  </g>
</svg>
