<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <pattern id="grid-rb" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#14161A" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="ticks-rb" width="20" height="14" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="14" fill="#14161A" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1000" height="1000" fill="#D7D7E1"/>
  <rect width="1000" height="1000" fill="url(#grid-rb)"/>
  <rect width="1000" height="14" fill="url(#ticks-rb)"/>

  <text x="48" y="72" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" letter-spacing="2" fill="#6B6E76">FIG. 01 — WIDERSTANDSBAND-SET</text>

  <!-- three overlapping resistance band loops -->
  <g transform="translate(500 520)">
    <rect x="-330" y="-70" width="660" height="150" rx="75" transform="rotate(-10)" fill="none" stroke="#14161A" stroke-width="7" opacity="0.55"/>
    <rect x="-330" y="-70" width="660" height="150" rx="75" transform="rotate(-2)" fill="#2DD9AA" fill-opacity="0.85" stroke="#0A2E27" stroke-width="7"/>
    <rect x="-310" y="-58" width="620" height="126" rx="63" transform="rotate(7)" fill="#FF4B22" fill-opacity="0.9" stroke="#14161A" stroke-width="7"/>
  </g>

  <!-- dimension line -->
  <g font-family="IBM Plex Mono, ui-monospace, monospace" fill="#6B6E76">
    <line x1="150" y1="830" x2="850" y2="830" stroke="#14161A" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="150" y1="818" x2="150" y2="842" stroke="#14161A" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="850" y1="818" x2="850" y2="842" stroke="#14161A" stroke-opacity="0.3" stroke-width="2"/>
    <text x="500" y="875" font-size="20" text-anchor="middle" letter-spacing="1">3× WIDERSTANDSSTUFEN — 1200 MM</text>
  </g>
</svg>
