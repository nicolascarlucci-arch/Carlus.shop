<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <pattern id="grid-sr" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#14161A" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="ticks-sr" width="20" height="14" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="14" fill="#14161A" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1000" height="1000" fill="#D7D7E1"/>
  <rect width="1000" height="1000" fill="url(#grid-sr)"/>
  <rect width="1000" height="14" fill="url(#ticks-sr)"/>

  <text x="48" y="72" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" letter-spacing="2" fill="#6B6E76">FIG. 03 — SPRINGSEIL</text>

  <!-- rope loop -->
  <path d="M 280 360 C 460 300, 540 700, 720 640" fill="none" stroke="#FF4B22" stroke-width="14" stroke-linecap="round"/>
  <path d="M 280 360 C 460 300, 540 700, 720 640" fill="none" stroke="#14161A" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- ball-bearing joints -->
  <circle cx="280" cy="360" r="14" fill="#14161A"/>
  <circle cx="720" cy="640" r="14" fill="#14161A"/>

  <!-- handles -->
  <rect x="235" y="230" width="70" height="180" rx="35" fill="#14161A"/>
  <rect x="695" y="590" width="70" height="180" rx="35" fill="#14161A"/>
  <rect x="248" y="250" width="44" height="60" rx="14" fill="#2DD9AA"/>
  <rect x="708" y="610" width="44" height="60" rx="14" fill="#2DD9AA"/>

  <!-- dimension line -->
  <g font-family="IBM Plex Mono, ui-monospace, monospace" fill="#6B6E76">
    <line x1="150" y1="850" x2="850" y2="850" stroke="#14161A" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="150" y1="838" x2="150" y2="862" stroke="#14161A" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="850" y1="838" x2="850" y2="862" stroke="#14161A" stroke-opacity="0.3" stroke-width="2"/>
    <text x="500" y="895" font-size="20" text-anchor="middle" letter-spacing="1">LÄNGE VERSTELLBAR — KUGELLAGER-GRIFFE</text>
  </g>
</svg>
